# Vault helpers for tag-driven CI.
# Included from .gitlab-ci.yml. Do NOT declare stages: here (would override the parent list).
# YAML anchors do not cross include files — jobs must !reference these hidden jobs.

.vault_sonar:
  before_script:
    - export TZ="Asia/Bangkok"
    - 'if command -v apk >/dev/null 2>&1; then apk add --no-cache tzdata curl jq >/dev/null 2>&1 || true; elif command -v apt-get >/dev/null 2>&1; then apt-get update >/dev/null 2>&1 && apt-get install -y tzdata curl jq >/dev/null 2>&1 || true; fi'
    - echo "=== Fetching SonarQube secrets from HashiCorp Vault Cluster ==="
    - |
      if [ -n "$VAULT_TOKEN" ]; then
        for v_url in ${VAULT_SERVERS:-$VAULT_ADDR}; do
          echo "Trying Vault node for SonarQube secrets: ${v_url}..."
          VAULT_SONAR_RESP=$(curl -s --fail -k --connect-timeout 3 --header "X-Vault-Token: ${VAULT_TOKEN}" "${v_url}/v1/secret/data/SONAR-CI" || true)
          if [ -z "$VAULT_SONAR_RESP" ] && echo "$v_url" | grep -q "^http://"; then
            alt_url=$(echo "$v_url" | sed "s|^http://|https://|")
            VAULT_SONAR_RESP=$(curl -s --fail -k --connect-timeout 3 --header "X-Vault-Token: ${VAULT_TOKEN}" "${alt_url}/v1/secret/data/SONAR-CI" || true)
          fi
          if [ -n "$VAULT_SONAR_RESP" ]; then
            echo "=== Successfully fetched SonarQube secrets from Vault (secret/data/SONAR-CI) ==="
            if command -v jq >/dev/null 2>&1; then
              V_SONAR_URL=$(echo "$VAULT_SONAR_RESP" | jq -r '.data.data.SONAR_URL // .data.data.sonar_url // empty')
              V_SONAR_TOKEN=$(echo "$VAULT_SONAR_RESP" | jq -r '.data.data["SONAR_TOKEN-CI"] // .data.data.SONAR_TOKEN // .data.data.sonar_token // empty')
            else
              V_SONAR_URL=$(echo "$VAULT_SONAR_RESP" | sed -n 's/.*"SONAR_URL"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              V_SONAR_TOKEN=$(echo "$VAULT_SONAR_RESP" | sed -n 's/.*"SONAR_TOKEN-CI"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              [ -z "$V_SONAR_TOKEN" ] && V_SONAR_TOKEN=$(echo "$VAULT_SONAR_RESP" | sed -n 's/.*"SONAR_TOKEN"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            fi
            [ -n "$V_SONAR_URL" ] && export SONAR_HOST_URL="$V_SONAR_URL"
            [ -n "$V_SONAR_TOKEN" ] && export SONAR_TOKEN="$V_SONAR_TOKEN"
            break
          fi
        done
      else
        echo "⚠️ VAULT_TOKEN is not defined in CI/CD variables."
      fi

      echo "=== [Verification] SonarQube Vault Secret Extraction ==="
      if [ -n "$SONAR_HOST_URL" ]; then
        echo "✅ SONAR_HOST_URL : ${SONAR_HOST_URL}"
      else
        echo "❌ SONAR_HOST_URL : NOT FOUND"
      fi

      if [ -n "$SONAR_TOKEN" ]; then
        TOKEN_LEN=${#SONAR_TOKEN}
        TOKEN_HEAD=$(echo "$SONAR_TOKEN" | cut -c 1-4)
        TOKEN_TAIL=$(echo "$SONAR_TOKEN" | rev | cut -c 1-4 | rev)
        echo "✅ SONAR_TOKEN    : LOADED (Length: ${TOKEN_LEN} chars, Preview: ${TOKEN_HEAD}****${TOKEN_TAIL})"
      else
        echo "❌ SONAR_TOKEN    : NOT FOUND"
      fi

.vault_deploy:
  script:
    - |
      fetch_vault_deploy_secrets() {
        ENV_NAME="$1"
        if [ -z "$VAULT_TOKEN" ]; then
          echo "⚠️ VAULT_TOKEN is not defined in CI/CD variables."
          return 0
        fi

        slugs="${VAULT_PROJECT_NAME:-$CI_PROJECT_NAME}"
        if [ -n "${VAULT_EXTRA_PROJECT_NAMES:-}" ]; then
          slugs="$slugs $VAULT_EXTRA_PROJECT_NAMES"
        fi

        for v_url in ${VAULT_SERVERS:-$VAULT_ADDR}; do
          echo "Trying Vault node: ${v_url}..."

          VAULT_COMMON_RESP=$(curl -s --fail -k --connect-timeout 3 --header "X-Vault-Token: ${VAULT_TOKEN}" "${v_url}/v1/secret/data/KUBECONFIG" || true)
          if [ -z "$VAULT_COMMON_RESP" ] && echo "$v_url" | grep -q "^http://"; then
            alt_url=$(echo "$v_url" | sed "s|^http://|https://|")
            VAULT_COMMON_RESP=$(curl -s --fail -k --connect-timeout 3 --header "X-Vault-Token: ${VAULT_TOKEN}" "${alt_url}/v1/secret/data/KUBECONFIG" || true)
          fi

          if [ -n "$VAULT_COMMON_RESP" ]; then
            echo "=== Successfully fetched common secrets from Vault (secret/data/KUBECONFIG) ==="
            V_KUBE_COMMON=$(echo "$VAULT_COMMON_RESP" | jq -r '.data.data.KUBECONFIG // empty')
            V_REG_HOST_COMMON=$(echo "$VAULT_COMMON_RESP" | jq -r '.data.data.REGISTRY_HOST // empty')
            [ -n "$V_KUBE_COMMON" ] && KUBECONFIG="${KUBECONFIG:-$V_KUBE_COMMON}"
            [ -n "$V_REG_HOST_COMMON" ] && REGISTRY_HOST="${REGISTRY_HOST:-$V_REG_HOST_COMMON}"
          fi

          VAULT_ENV_RESP=""
          for slug in $slugs; do
            [ -z "$slug" ] && continue
            echo "Trying project path secret/data/${slug}/${ENV_NAME} ..."
            VAULT_ENV_RESP=$(curl -s --fail -k --connect-timeout 3 --header "X-Vault-Token: ${VAULT_TOKEN}" "${v_url}/v1/secret/data/${slug}/${ENV_NAME}" || true)
            if [ -z "$VAULT_ENV_RESP" ] && echo "$v_url" | grep -q "^http://"; then
              alt_url=$(echo "$v_url" | sed "s|^http://|https://|")
              VAULT_ENV_RESP=$(curl -s --fail -k --connect-timeout 3 --header "X-Vault-Token: ${VAULT_TOKEN}" "${alt_url}/v1/secret/data/${slug}/${ENV_NAME}" || true)
            fi
            [ -n "$VAULT_ENV_RESP" ] && break
          done

          if [ -n "$VAULT_ENV_RESP" ]; then
            echo "=== Successfully connected to Vault node for env ${ENV_NAME} ==="
            ENV_UPPER=$(echo "$ENV_NAME" | tr '[:lower:]' '[:upper:]')
            V_KUBE=$(echo "$VAULT_ENV_RESP" | jq -r ".data.data.KUBECONFIG_${ENV_UPPER} // .data.data.KUBECONFIG // empty")
            V_DOTENV=$(echo "$VAULT_ENV_RESP" | jq -r ".data.data.DOTENV_${ENV_UPPER} // .data.data.DOTENV // empty")
            V_USER=$(echo "$VAULT_ENV_RESP" | jq -r '.data.data.REGISTRY_USER // empty')
            V_TOKEN=$(echo "$VAULT_ENV_RESP" | jq -r '.data.data.REGISTRY_TOKEN // empty')
            V_REG_HOST=$(echo "$VAULT_ENV_RESP" | jq -r '.data.data.REGISTRY_HOST // empty')
            [ -n "$V_KUBE" ] && KUBECONFIG="${KUBECONFIG:-$V_KUBE}"
            [ -n "$V_USER" ] && REGISTRY_USER="${REGISTRY_USER:-$V_USER}"
            [ -n "$V_TOKEN" ] && REGISTRY_TOKEN="${REGISTRY_TOKEN:-$V_TOKEN}"
            [ -n "$V_REG_HOST" ] && REGISTRY_HOST="${REGISTRY_HOST:-$V_REG_HOST}"
            case "$ENV_NAME" in
              dev)  [ -n "$V_DOTENV" ] && DOTENV_DEV="${DOTENV_DEV:-$V_DOTENV}" ;;
              test) [ -n "$V_DOTENV" ] && DOTENV_TEST="${DOTENV_TEST:-$V_DOTENV}" ;;
              prod) [ -n "$V_DOTENV" ] && DOTENV_PROD="${DOTENV_PROD:-$V_DOTENV}" ;;
            esac
            export KUBECONFIG REGISTRY_USER REGISTRY_TOKEN REGISTRY_HOST
            export DOTENV_DEV DOTENV_TEST DOTENV_PROD
            break
          fi

          if [ -n "$VAULT_COMMON_RESP" ]; then
            break
          fi
        done
      }
