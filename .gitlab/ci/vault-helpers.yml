# Shared Vault KV helpers (Sonar + deploy). Never log secrets.
.vault_kv_helpers:
  before_script:
    - |
      vault_kv_get() {
        base_url="$1"
        kv_path="$2"
        tmp="$(mktemp)"
        errf="$(mktemp)"
        code="$(curl -sS -o "$tmp" -w "%{http_code}" -k --connect-timeout 5 --max-time 15 \
          --header "X-Vault-Token: ${VAULT_TOKEN}" \
          "${base_url}/v1/${kv_path}" 2>"$errf" || true)"
        [ -z "$code" ] && code="000"
        if [ "$code" = "200" ]; then
          cat "$tmp"
          rm -f "$tmp" "$errf"
          return 0
        fi
        vault_errs="$(jq -r '.errors[]? // empty' "$tmp" 2>/dev/null | tr '\n' ';')"
        curl_err="$(tr '\n' ' ' < "$errf")"
        echo "WARN: Vault GET path=${kv_path} url=${base_url} http=${code}${vault_errs:+ vault_errors=${vault_errs}}${curl_err:+ curl=${curl_err}}" >&2
        rm -f "$tmp" "$errf"
        return 1
      }

      # Prefer HTTPS first when VAULT_SERVERS still lists http:// (campus Vault is TLS on :8200).
      vault_kv_get_http_then_https() {
        base_url="$1"
        kv_path="$2"
        case "$base_url" in
          http://*)
            https_url="https://${base_url#http://}"
            echo "Trying Vault path=${kv_path} over HTTPS first: ${https_url}" >&2
            body="$(vault_kv_get "$https_url" "$kv_path" || true)"
            if [ -n "$body" ]; then
              printf '%s' "$body"
              return 0
            fi
            echo "Falling back to HTTP for path=${kv_path}: ${base_url}" >&2
            ;;
        esac
        body="$(vault_kv_get "$base_url" "$kv_path" || true)"
        if [ -n "$body" ]; then
          printf '%s' "$body"
          return 0
        fi
        return 1
      }
