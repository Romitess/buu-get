# ==============================================================================
# BUU GET — GitLab CI/CD (tag-driven: build + deploy by git tag)
# Monorepo: apps/backend (NestJS) + apps/frontend (Quasar) · Node.js 24
#
# Pipeline Flow (only tags matching /^v\d+\.\d+\.\d+(-dev|-test)?$/):
#
#   prepare ── resolve-deploy-target   (suffix → env, ancestry, dotenv)
#   quality (parallel) ──┬── sonar-scan-api / sonar-scan-web
#                        ├── sonar-scan-quality-gate-api / -web
#                        ├── unit-test-api / unit-test-web
#                        ├── dependency-check-api / -web
#                        └── sbom-generate-api / -web
#   build ──┬── docker-build / docker-build-web   (no needs: waits for quality)
#           └── db-migrate-verify                 (needs docker-build)
#   image-scan ── image-scan / image-scan-web
#   deploy ──┬── deploy-dev   (auto,   vX.Y.Z-dev)
#            ├── deploy-test  (manual, vX.Y.Z-test)
#            └── deploy-prod  (manual, vX.Y.Z)
#   dast / perf — optional, manual
#
# Promotion: new tag per environment (not a re-run of the same tag).
#   git tag v1.2.0-dev  on develop → deploy-dev
#   git tag v1.2.0-test on test    → deploy-test (manual)
#   git tag v1.2.0      on main    → deploy-prod (manual)
# ==============================================================================

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev|-test)?$/
    - when: never

include:
  - local: .gitlab/ci/vault-helpers.yml
  - local: .gitlab/ci/deploy.yml

variables:
  SONAR_PROJECT_KEY_API:     "${CI_PROJECT_NAME}-api"
  SONAR_PROJECT_KEY_WEB:     "${CI_PROJECT_NAME}-web"
  IMAGE_API:                 "${CI_REGISTRY_IMAGE}/api"
  IMAGE_WEB:                 "${CI_REGISTRY_IMAGE}/web"
  IMAGE:                     $CI_REGISTRY_IMAGE
  APP_NAME:                  "${CI_PROJECT_NAME}"
  HELM_CHART_PATH:           "helm/app"
  NODE_VERSION:               "24"
  NODE_IMAGE:                 "node:24-alpine"
  RUNNER_TAG:                "gitrunner"
  DOCKER_TLS_CERTDIR:        ""
  TRIVY_NO_PROGRESS:         "true"
  TRIVY_CACHE_DIR:           ".trivycache"
  TZ:                        "Asia/Bangkok"
  APP_TIMEZONE:              "Asia/Bangkok"
  HUSKY:                     "0"
  SYFT_IMAGE:                "anchore/syft:v1.20.0-debug"

default:
  before_script:
    - export TZ="Asia/Bangkok"
    - 'if command -v apk >/dev/null 2>&1; then apk add --no-cache tzdata >/dev/null 2>&1 && cp /usr/share/zoneinfo/Asia/Bangkok /etc/localtime && echo "Asia/Bangkok" > /etc/timezone; fi'

stages:
  - prepare
  - quality
  - build
  - image-scan
  - deploy
  - dast
  - perf

# ─── Docker-in-Docker Base Anchor ─────────────────────────────────────────────
.docker_service: &docker_service
  image: docker:24-cli
  tags:
    - $RUNNER_TAG
  services:
    - name: docker:24-dind
      alias: docker
      command:
        - "dockerd"
        - "--host=tcp://0.0.0.0:2375"
        - "--host=unix:///var/run/docker.sock"
        - "--insecure-registry=gitlabregistry.buu.ac.th"
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - 'if [ -S /var/run/docker.sock ]; then echo "=== Using local Docker socket ===" && unset DOCKER_HOST; else echo "=== Connecting to DinD (tcp://docker:2375) ===" && export DOCKER_HOST="tcp://docker:2375"; for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || (echo "Waiting for DinD ($i)..." && sleep 1); done; fi'
    - docker info

# ==============================================================================
# STAGE 0 — Prepare (suffix → env, ancestry, dotenv)
# ==============================================================================
resolve-deploy-target:
  stage: prepare
  image:
    name: alpine/git
    entrypoint: [""]
  tags:
    - $RUNNER_TAG
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -e
      TAG="$CI_COMMIT_TAG"
      case "$TAG" in
        *-dev)
          DEPLOY_ENV=dev
          BRANCH=develop
          APP_VERSION="${TAG%-dev}"
          ;;
        *-test)
          DEPLOY_ENV=test
          BRANCH=test
          APP_VERSION="${TAG%-test}"
          ;;
        *)
          DEPLOY_ENV=prod
          BRANCH=main
          APP_VERSION="$TAG"
          ;;
      esac
      echo "=== Tag ${TAG} → DEPLOY_ENV=${DEPLOY_ENV} APP_VERSION=${APP_VERSION} fetch origin/${BRANCH} ==="
      git fetch --no-tags origin "${BRANCH}"
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/${BRANCH}"; then
        echo "tag ${TAG} targets ${DEPLOY_ENV} but commit is not on ${BRANCH}"
        exit 1
      fi
      {
        echo "DEPLOY_ENV=${DEPLOY_ENV}"
        echo "IMAGE_TAG=${TAG}"
        echo "DEPLOY_NAMESPACE=${DEPLOY_ENV}"
        echo "APP_VERSION=${APP_VERSION}"
      } > deploy-target.env
      cat deploy-target.env
  artifacts:
    reports:
      dotenv: deploy-target.env

# ==============================================================================
# STAGE 1 — Quality (Parallel Execution)
# ==============================================================================

sonar-scan-api:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - !reference [.vault_sonar, before_script]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-api-${CI_PROJECT_NAME}"
    paths:
      - .sonar/cache
  script:
    - echo "=== SonarQube Scan API (${SONAR_PROJECT_KEY_API}) ==="
    - 'if [ -z "${SONAR_HOST_URL}" ] || [ -z "${SONAR_TOKEN}" ]; then echo "❌ ERROR: SONAR_HOST_URL or SONAR_TOKEN is not configured." && exit 1; fi'
    - 'TARGET_DIR="apps/backend"; if [ ! -d "apps/backend" ]; then if [ -d "apps/api" ]; then TARGET_DIR="apps/api"; elif [ -d "api" ]; then TARGET_DIR="api"; else TARGET_DIR="."; fi; fi'
    - "sonar-scanner -Dsonar.projectKey=${SONAR_PROJECT_KEY_API} -Dsonar.projectName=${CI_PROJECT_NAME}-api -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.token=${SONAR_TOKEN} -Dsonar.sources=${TARGET_DIR} -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/tests/**,**/test/**,old_app/** -Dsonar.qualitygate.wait=false"
  allow_failure: false

sonar-scan-web:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - !reference [.vault_sonar, before_script]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-web-${CI_PROJECT_NAME}"
    paths:
      - .sonar/cache
  script:
    - echo "=== SonarQube Scan Web (${SONAR_PROJECT_KEY_WEB}) ==="
    - 'if [ -z "${SONAR_HOST_URL}" ] || [ -z "${SONAR_TOKEN}" ]; then echo "❌ ERROR: SONAR_HOST_URL or SONAR_TOKEN is not configured." && exit 1; fi'
    - 'if [ -d "apps/frontend" ]; then TARGET_DIR="apps/frontend"; elif [ -d "apps/web" ]; then TARGET_DIR="apps/web"; elif [ -d "web" ]; then TARGET_DIR="web"; elif [ -d "frontend" ]; then TARGET_DIR="frontend"; else echo "No web folder found, scanning root UI components or skipping..." && TARGET_DIR="src"; fi'
    - 'if [ -d "$TARGET_DIR" ]; then sonar-scanner -Dsonar.projectKey=${SONAR_PROJECT_KEY_WEB} -Dsonar.projectName=${CI_PROJECT_NAME}-web -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.token=${SONAR_TOKEN} -Dsonar.sources=${TARGET_DIR} -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,old_app/** -Dsonar.qualitygate.wait=false; else echo "Target web folder not found. Skipping web scan."; fi'
  allow_failure: false

sonar-scan-quality-gate-api:
  stage: quality
  image: alpine:3.19
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - !reference [.vault_sonar, before_script]
  needs:
    - job: sonar-scan-api
  script:
    - echo "=== Quality Gate check API (${SONAR_PROJECT_KEY_API}) ==="
    - 'if [ -z "${SONAR_HOST_URL}" ] || [ -z "${SONAR_TOKEN}" ]; then echo "❌ ERROR: SONAR_HOST_URL or SONAR_TOKEN is not configured." && exit 1; fi'
    - 'RESP=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY_API}")'
    - 'STATUS=$(echo "$RESP" | jq -r ".projectStatus.status // empty")'
    - 'echo "Quality Gate API Status: ${STATUS:-UNKNOWN}"'
    - |
      if [ "${STATUS}" = "OK" ]; then
        echo "✅ Quality Gate PASSED successfully!"
      elif [ "${STATUS}" = "ERROR" ]; then
        echo "⚠️ Quality Gate FAILED (Metric thresholds not met):"
        echo "$RESP" | jq -r '.projectStatus.conditions[]? | select(.status == "ERROR") | "  - \(.metricKey): actual=\(.actualValue), threshold=\(.errorThreshold)"' 2>/dev/null || true
        echo "ℹ️ View details on dashboard: ${SONAR_HOST_URL}/dashboard?id=${SONAR_PROJECT_KEY_API}"
      else
        echo "ℹ️ Quality Gate status is ${STATUS:-PENDING}"
      fi
  allow_failure: false

sonar-scan-quality-gate-web:
  stage: quality
  image: alpine:3.19
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - !reference [.vault_sonar, before_script]
  needs:
    - job: sonar-scan-web
  script:
    - echo "=== Quality Gate check Web (${SONAR_PROJECT_KEY_WEB}) ==="
    - 'if [ -z "${SONAR_HOST_URL}" ] || [ -z "${SONAR_TOKEN}" ]; then echo "❌ ERROR: SONAR_HOST_URL or SONAR_TOKEN is not configured." && exit 1; fi'
    - 'RESP=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY_WEB}")'
    - 'STATUS=$(echo "$RESP" | jq -r ".projectStatus.status // empty")'
    - 'echo "Quality Gate Web Status: ${STATUS:-UNKNOWN}"'
    - |
      if [ "${STATUS}" = "OK" ]; then
        echo "✅ Quality Gate PASSED successfully!"
      elif [ "${STATUS}" = "ERROR" ]; then
        echo "⚠️ Quality Gate FAILED (Metric thresholds not met):"
        echo "$RESP" | jq -r '.projectStatus.conditions[]? | select(.status == "ERROR") | "  - \(.metricKey): actual=\(.actualValue), threshold=\(.errorThreshold)"' 2>/dev/null || true
        echo "ℹ️ View details on dashboard: ${SONAR_HOST_URL}/dashboard?id=${SONAR_PROJECT_KEY_WEB}"
      else
        echo "ℹ️ Quality Gate status is ${STATUS:-PENDING}"
      fi
  allow_failure: false

unit-test-api:
  stage: quality
  image: ${NODE_IMAGE}
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  cache:
    key: "npm-api-${CI_COMMIT_REF_SLUG}"
    paths:
      - node_modules/
      - apps/backend/node_modules/
      - api/node_modules/
  script:
    - echo "=== Node.js Unit Test (API / apps/backend) ==="
    - 'if [ -d "apps/backend" ]; then cd apps/backend; elif [ -d "api" ]; then cd api; fi'
    - 'if [ -f "package.json" ]; then npm ci || npm install; npm test -- --ci --reporters=default || npm test || true; else echo "No package.json found for API, skipping unit tests."; fi'
  artifacts:
    when: always
    reports:
      junit:
        - junit-api.xml
        - apps/backend/junit.xml
        - api/junit.xml
    paths:
      - coverage/
      - apps/backend/coverage/
      - api/coverage/
    expire_in: 7 days
  allow_failure: true

unit-test-web:
  stage: quality
  image: ${NODE_IMAGE}
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  cache:
    key: "npm-web-${CI_COMMIT_REF_SLUG}"
    paths:
      - node_modules/
      - apps/frontend/node_modules/
      - web/node_modules/
      - frontend/node_modules/
  script:
    - echo "=== Node.js Unit Test (Web / apps/frontend) ==="
    - 'if [ -d "apps/frontend" ]; then cd apps/frontend; elif [ -d "web" ]; then cd web; elif [ -d "frontend" ]; then cd frontend; fi'
    - 'if [ -f "package.json" ]; then npm ci || npm install; npm test -- --ci --reporters=default || npm test || true; else echo "No web package.json found, skipping web unit tests."; fi'
  artifacts:
    when: always
    reports:
      junit:
        - junit-web.xml
        - apps/frontend/junit.xml
        - web/junit.xml
        - frontend/junit.xml
    paths:
      - coverage/
      - apps/frontend/coverage/
      - web/coverage/
      - frontend/coverage/
    expire_in: 7 days
  allow_failure: true

dependency-check-api:
  stage: quality
  image: ${NODE_IMAGE}
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  cache:
    key: "npm-api-${CI_COMMIT_REF_SLUG}"
    paths:
      - node_modules/
      - apps/backend/node_modules/
      - api/node_modules/
  script:
    - echo "=== Node.js Dependency Check (API) ==="
    - 'if [ -d "apps/backend" ]; then cd apps/backend; elif [ -d "api" ]; then cd api; fi'
    - 'if [ -f "package.json" ]; then npm audit --audit-level=high || true; else echo "No API package.json found for dependency check."; fi'
  artifacts:
    when: always
    paths:
      - npm-audit-api.json
      - apps/backend/npm-audit-api.json
      - api/npm-audit-api.json
    expire_in: 7 days
  allow_failure: true

dependency-check-web:
  stage: quality
  image: ${NODE_IMAGE}
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  cache:
    key: "npm-web-${CI_COMMIT_REF_SLUG}"
    paths:
      - node_modules/
      - apps/frontend/node_modules/
      - web/node_modules/
      - frontend/node_modules/
  script:
    - echo "=== Node.js Dependency Check (Web) ==="
    - 'if [ -d "apps/frontend" ]; then cd apps/frontend; elif [ -d "web" ]; then cd web; elif [ -d "frontend" ]; then cd frontend; fi'
    - 'if [ -f "package.json" ]; then npm audit --audit-level=high || true; else echo "No Web package.json found for dependency check."; fi'
  artifacts:
    when: always
    paths:
      - npm-audit-web.json
      - apps/frontend/npm-audit-web.json
      - web/npm-audit-web.json
      - frontend/npm-audit-web.json
    expire_in: 7 days
  allow_failure: true

sbom-generate-api:
  stage: quality
  image:
    name: $SYFT_IMAGE
    entrypoint: [""]
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "=== SBOM Generation API (Syft) ==="
    - 'TARGET_DIR="apps/backend"; if [ ! -d "apps/backend" ]; then if [ -d "api" ]; then TARGET_DIR="api"; else TARGET_DIR="."; fi; fi'
    - /syft dir:${TARGET_DIR} -o spdx-json=sbom-api.json
    - echo "API SBOM saved to sbom-api.json"
  artifacts:
    paths:
      - sbom-api.json
    expire_in: 30 days
  allow_failure: true

sbom-generate-web:
  stage: quality
  image:
    name: $SYFT_IMAGE
    entrypoint: [""]
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "=== SBOM Generation Web (Syft) ==="
    - 'if [ -d "apps/frontend" ]; then TARGET_DIR="apps/frontend"; elif [ -d "web" ]; then TARGET_DIR="web"; elif [ -d "frontend" ]; then TARGET_DIR="frontend"; else echo "No web directory found, skipping web SBOM generation." && exit 0; fi'
    - /syft dir:${TARGET_DIR} -o spdx-json=sbom-web.json
    - echo "Web SBOM saved to sbom-web.json"
  artifacts:
    paths:
      - sbom-web.json
    expire_in: 30 days
  allow_failure: true

# ==============================================================================
# STAGE 2 — Build & Push Docker Images (API & Web)
# No needs: on docker-build* — must wait for the whole quality stage.
# ==============================================================================

docker-build:
  <<: *docker_service
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker version
    - 'REG_HOST="${REGISTRY_HOST:-${CI_REGISTRY:-gitlabregistry.buu.ac.th}}"; if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then echo "$CI_REGISTRY_PASSWORD" | docker login "$REG_HOST" -u "$CI_REGISTRY_USER" --password-stdin || true; elif [ -n "$REGISTRY_USER" ] && [ -n "$REGISTRY_TOKEN" ]; then echo "$REGISTRY_TOKEN" | docker login "$REG_HOST" -u "$REGISTRY_USER" --password-stdin || true; fi'
    - 'DOCKERFILE_PATH=""; if [ -f "apps/backend/Dockerfile" ]; then DOCKERFILE_PATH="apps/backend/Dockerfile"; elif [ -f "apps/api/Dockerfile" ]; then DOCKERFILE_PATH="apps/api/Dockerfile"; elif [ -f "api/Dockerfile" ]; then DOCKERFILE_PATH="api/Dockerfile"; elif [ -f "Dockerfile.api" ]; then DOCKERFILE_PATH="Dockerfile.api"; elif [ -f "Dockerfile" ]; then DOCKERFILE_PATH="Dockerfile"; fi'
    - 'if [ -z "$DOCKERFILE_PATH" ]; then echo "No API Dockerfile found (checked apps/backend/Dockerfile, apps/api/Dockerfile, api/Dockerfile, Dockerfile.api, Dockerfile). Skipping Docker Build API." && exit 0; fi'
    - |
      IMAGE_REF="${IMAGE_API}:${CI_COMMIT_TAG}"
      echo "=== API image ${IMAGE_REF} (APP_VERSION=${APP_VERSION}) using ${DOCKERFILE_PATH} ==="
      if docker manifest inspect "${IMAGE_REF}" >/dev/null 2>&1; then
        echo "=== Image ${IMAGE_REF} already exists, skipping rebuild ==="
      else
        docker build --build-arg NODE_VERSION="${NODE_VERSION}" --build-arg APP_VERSION="${APP_VERSION}" -f "${DOCKERFILE_PATH}" -t "${IMAGE_REF}" .
        docker push "${IMAGE_REF}"
      fi
      if [ "${DEPLOY_ENV}" = "prod" ]; then
        echo "=== Prod: pull ${IMAGE_REF} and push :latest ==="
        docker pull "${IMAGE_REF}"
        docker tag "${IMAGE_REF}" "${IMAGE_API}:latest"
        docker push "${IMAGE_API}:latest"
      fi

docker-build-web:
  <<: *docker_service
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker version
    - 'REG_HOST="${REGISTRY_HOST:-${CI_REGISTRY:-gitlabregistry.buu.ac.th}}"; if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then echo "$CI_REGISTRY_PASSWORD" | docker login "$REG_HOST" -u "$CI_REGISTRY_USER" --password-stdin || true; elif [ -n "$REGISTRY_USER" ] && [ -n "$REGISTRY_TOKEN" ]; then echo "$REGISTRY_TOKEN" | docker login "$REG_HOST" -u "$REGISTRY_USER" --password-stdin || true; fi'
    - 'DOCKERFILE_PATH=""; if [ -f "apps/frontend/Dockerfile" ]; then DOCKERFILE_PATH="apps/frontend/Dockerfile"; elif [ -f "docker/web/Dockerfile" ]; then DOCKERFILE_PATH="docker/web/Dockerfile"; elif [ -f "apps/web/Dockerfile" ]; then DOCKERFILE_PATH="apps/web/Dockerfile"; elif [ -f "web/Dockerfile" ]; then DOCKERFILE_PATH="web/Dockerfile"; elif [ -f "frontend/Dockerfile" ]; then DOCKERFILE_PATH="frontend/Dockerfile"; elif [ -f "Dockerfile.web" ]; then DOCKERFILE_PATH="Dockerfile.web"; fi'
    - 'if [ -z "$DOCKERFILE_PATH" ]; then echo "No Web Dockerfile found. Skipping Docker Build Web." && exit 0; fi'
    - |
      IMAGE_REF="${IMAGE_WEB}:${CI_COMMIT_TAG}"
      echo "=== Web image ${IMAGE_REF} (VITE_APP_VERSION=${APP_VERSION}) using ${DOCKERFILE_PATH} ==="
      if docker manifest inspect "${IMAGE_REF}" >/dev/null 2>&1; then
        echo "=== Image ${IMAGE_REF} already exists, skipping rebuild ==="
      else
        docker build --build-arg NODE_VERSION="${NODE_VERSION}" --build-arg API_BASE_URL=/api --build-arg VITE_API_BASE_URL=/api --build-arg VITE_APP_VERSION="${APP_VERSION}" -f "${DOCKERFILE_PATH}" -t "${IMAGE_REF}" .
        docker push "${IMAGE_REF}"
      fi
      if [ "${DEPLOY_ENV}" = "prod" ]; then
        echo "=== Prod: pull ${IMAGE_REF} and push :latest ==="
        docker pull "${IMAGE_REF}"
        docker tag "${IMAGE_REF}" "${IMAGE_WEB}:latest"
        docker push "${IMAGE_WEB}:latest"
      fi

db-migrate-verify:
  stage: build
  image:
    name: ${IMAGE_API}:${CI_COMMIT_TAG}
    entrypoint: [""]
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - docker-build
  services:
    - name: mysql:8.0
  before_script:
    - export TZ="Asia/Bangkok"
    - cd /app/apps/backend
  variables:
    GIT_STRATEGY: none
    MYSQL_ROOT_PASSWORD: migrate-verify
    MYSQL_DATABASE: buu_get_verify
    DB_TYPE: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_USER: root
    DB_PASSWORD: migrate-verify
    DB_NAME: buu_get_verify
  script:
    - echo "=== Waiting for empty MySQL (db-migrate-verify) ==="
    - |
      node -e "
        const net = require('net');
        const host = process.env.DB_HOST || 'mysql';
        const port = Number(process.env.DB_PORT || 3306);
        const tryOnce = (left) => {
          const s = net.connect({ host, port }, () => { s.end(); process.exit(0); });
          s.on('error', () => {
            s.destroy();
            if (left <= 1) {
              console.error('MySQL did not become ready at ' + host + ':' + port);
              process.exit(1);
            }
            setTimeout(() => tryOnce(left - 1), 2000);
          });
        };
        tryOnce(30);
      "
    - echo "=== TypeORM migration:show ==="
    - node ../../node_modules/typeorm/cli.js migration:show -d dist/database/data-source.js
    - echo "=== TypeORM migration:run (empty MySQL) ==="
    - node ../../node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js

# ==============================================================================
# STAGE 3 — Docker Image Scan (Trivy)
# ==============================================================================
image-scan:
  stage: image-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - docker-build
    - resolve-deploy-target
    - db-migrate-verify
  cache:
    paths:
      - .trivycache/
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_INSECURE: "true"
  script:
    - echo "=== Trivy Remote Image Scan (API ${IMAGE_API}:${CI_COMMIT_TAG}) ==="
    - trivy image --format json --output trivy-report-api.json --severity HIGH,CRITICAL --exit-code 0 "${IMAGE_API}:${CI_COMMIT_TAG}" || true
    - trivy image --format table --severity HIGH,CRITICAL "${IMAGE_API}:${CI_COMMIT_TAG}" || true
    - |
      if [ "${DEPLOY_ENV}" = "prod" ]; then
        echo "=== [PROD API] Strict: fail on CRITICAL ==="
        trivy image --severity CRITICAL --exit-code 1 "${IMAGE_API}:${CI_COMMIT_TAG}"
      fi
  artifacts:
    when: always
    paths:
      - trivy-report-api.json
    expire_in: 7 days
  allow_failure: false

image-scan-web:
  stage: image-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - docker-build-web
    - resolve-deploy-target
  cache:
    paths:
      - .trivycache/
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_INSECURE: "true"
  script:
    - echo "=== Trivy Remote Image Scan (Web ${IMAGE_WEB}:${CI_COMMIT_TAG}) ==="
    - trivy image --format json --output trivy-report-web.json --severity HIGH,CRITICAL --exit-code 0 "${IMAGE_WEB}:${CI_COMMIT_TAG}" || true
    - trivy image --format table --severity HIGH,CRITICAL "${IMAGE_WEB}:${CI_COMMIT_TAG}" || true
    - |
      if [ "${DEPLOY_ENV}" = "prod" ]; then
        echo "=== [PROD WEB] Strict: fail on CRITICAL ==="
        trivy image --severity CRITICAL --exit-code 1 "${IMAGE_WEB}:${CI_COMMIT_TAG}"
      fi
  artifacts:
    when: always
    paths:
      - trivy-report-web.json
    expire_in: 7 days
  allow_failure: false

# ==============================================================================
# STAGE 5 — DAST: OWASP ZAP (optional, manual)
# ==============================================================================
dast:
  stage: dast
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: true
  variables:
    ZAP_TARGET: $APP_URL_TEST
  script:
    - 'echo "=== OWASP ZAP Baseline Scan ${ZAP_TARGET} ==="'
    - mkdir -p /zap/wrk
    - zap-baseline.py -t "${ZAP_TARGET}" -r zap-report.html -J zap-report.json -I
  artifacts:
    when: always
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 7 days

# ==============================================================================
# STAGE 6 — Performance Test: k6 (optional, manual)
# ==============================================================================
perf-test:
  stage: perf
  image: grafana/k6:latest
  tags:
    - $RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: true
  variables:
    K6_TARGET: $APP_URL_TEST
  script:
    - 'echo "=== k6 Performance Test ${K6_TARGET} ==="'
    - 'echo "import http from \"k6/http\";" > load-test.js'
    - 'echo "import { check, sleep } from \"k6\";" >> load-test.js'
    - 'echo "export let options = { vus: 10, duration: \"30s\" };" >> load-test.js'
    - 'echo "export default function () { let res = http.get(\"${K6_TARGET}/\"); check(res, { status_is_200: (r) => r.status === 200 }); sleep(1); }" >> load-test.js'
    - 'k6 run load-test.js --out json=k6-results.json'
  artifacts:
    when: always
    paths:
      - k6-results.json
    expire_in: 7 days
