# ==============================================================================
# BUU GET — GitLab CI/CD (adapted from campus DevSecOps / digital-credential)
# Monorepo: apps/backend (NestJS) + apps/frontend (Quasar) · Node.js 24
#
# Pipeline Flow (tag-only: vX.Y.Z-dev / vX.Y.Z-test / vX.Y.Z; no branch/MR pipelines):
#
#   prepare ── resolve-deploy-target  (suffix → env; fetch matching branch only;
#                                      is-ancestor of develop/test/main; fail if mismatch;
#                                      dotenv: DEPLOY_ENV, IMAGE_TAG, DEPLOY_NAMESPACE, APP_VERSION)
#   quality (parallel) ──┬── sonar-scan-api / sonar-scan-web
#                        ├── sonar-scan-quality-gate-api / -web
#                        ├── unit-test-api / unit-test-web
#                        ├── dependency-check-api / -web
#                        └── sbom-generate-api / -web
#   build ──┬── docker-build / docker-build-web  (tag = CI_COMMIT_TAG; skip if
#   |            registry image revision label matches CI_COMMIT_SHA; :latest only when DEPLOY_ENV=prod)
#           └── db-migrate-verify (migration:show only — empty-DB migration:run
#               clashes EX_T_SESSIONS vs EXAM_T_SESSIONS)
#   image-scan  ──┬── image-scan / image-scan-web
#                 └── Trivy CRITICAL --exit-code 1 on every tag; scan-status-*.txt
#                     Dev: allow_failure true. Test/prod: hard fail.
#   deploy ── jobs from .gitlab/ci/deploy.yml, selected by tag suffix:
#             vX.Y.Z-dev → deploy-dev (auto, blocked if scan-status FAILED)
#                          + deploy-dev-manual (Play bypass; needs build, not scan);
#             vX.Y.Z-test → deploy-test (manual); vX.Y.Z → deploy-prod (manual).
#
# NOTE: - sonar-scan-* / sonar-scan-quality-gate-* ดึง secret (SONAR_URL, SONAR_TOKEN-CI)
#         จาก HashiCorp Vault (secret/data/SONAR-CI)
#       - deploy-* ดึง secret (KUBECONFIG_*, DOTENV_*, REGISTRY_USER, REGISTRY_TOKEN) จาก Vault
#       - Dockerfile: apps/backend และ apps/frontend (build context = repo root)
#       - DB migrate (env): kubectl Job (${RELEASE_NAME}-migrate) ก่อน helm upgrade
#         CLI path is ../../node_modules/typeorm/cli.js (image WORKDIR /app/apps/backend)
#       - Vault: secret/data/KUBECONFIG + secret/data/${VAULT_PROJECT_NAME:-$CI_PROJECT_NAME}/{dev|test|prod}
# ==============================================================================

variables:
  SONAR_PROJECT_KEY_API: "${CI_PROJECT_NAME}-api"
  SONAR_PROJECT_KEY_WEB: "${CI_PROJECT_NAME}-web"
  IMAGE_API: "${CI_REGISTRY_IMAGE}/api"
  IMAGE_WEB: "${CI_REGISTRY_IMAGE}/web"
  IMAGE: $CI_REGISTRY_IMAGE

  APP_NAME: "${CI_PROJECT_NAME}"
  HELM_CHART_PATH: "helm/app"
  NODE_VERSION: "24"
  NODE_IMAGE: "node:24-alpine"
  SONAR_SCANNER_IMAGE: "sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1"
  TRIVY_VERSION: "0.74.0"
  TRIVY_IMAGE: "aquasec/trivy:0.74.0"
  SYFT_IMAGE: "anchore/syft:v1.51.1-debug"
  GIT_IMAGE: "alpine/git:v2.47.2"
  DOCKER_CLI_IMAGE: "docker:24.0.9-cli"
  DOCKER_DIND_IMAGE: "docker:24.0.9-dind"
  ALPINE_IMAGE: "alpine:3.19"
  K6_IMAGE: "grafana/k6:1.2.2"
  MYSQL_IMAGE: "mysql:8.4"
  RUNNER_TAG: "gitrunner"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: ".trivycache"
  TZ: "Asia/Bangkok"
  APP_TIMEZONE: "Asia/Bangkok"
  HUSKY: "0"
  BACKEND_DIR: "apps/backend"
  FRONTEND_DIR: "apps/frontend"
  NPM_WORKSPACE_API: "buu-get-back"
  NPM_WORKSPACE_WEB: "buu-get-front"

include:
  - local: .gitlab/ci/vault-helpers.yml
  - local: .gitlab/ci/deploy.yml

default:
  interruptible: true
  tags:
    - $RUNNER_TAG
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
      - stuck_or_timeout_failure

# Tag-only pipelines (vX.Y.Z-dev / vX.Y.Z-test / vX.Y.Z). Branch pushes, merges, and MR events do not run.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev|-test)?$/
    - when: never

stages:
  - prepare
  - quality
  - build
  - image-scan
  - deploy
  - dast
  - perf

# ==============================================================================
# Hidden templates
# ==============================================================================

.rules_tag:
  rules:
    - if: $CI_COMMIT_TAG

.docker_service:
  image: $DOCKER_CLI_IMAGE
  services:
    - name: $DOCKER_DIND_IMAGE
      alias: docker
      command:
        - "dockerd"
        - "--host=tcp://0.0.0.0:2375"
        - "--host=unix:///var/run/docker.sock"
        - "--insecure-registry=gitlabregistry.buu.ac.th"
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: "1"
    BUILDKIT_PROGRESS: "plain"
  before_script:
    - 'if [ -S /var/run/docker.sock ]; then echo "=== Using local Docker socket ===" && unset DOCKER_HOST; else echo "=== Connecting to DinD (tcp://docker:2375) ===" && export DOCKER_HOST="tcp://docker:2375"; for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || (echo "Waiting for DinD ($i)..." && sleep 1); done; fi'
    - docker info
    - |
      REG_HOST="${REGISTRY_HOST:-${CI_REGISTRY:-gitlabregistry.buu.ac.th}}"
      if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login "$REG_HOST" -u "$CI_REGISTRY_USER" --password-stdin
      elif [ -n "$REGISTRY_USER" ] && [ -n "$REGISTRY_TOKEN" ]; then
        echo "$REGISTRY_TOKEN" | docker login "$REG_HOST" -u "$REGISTRY_USER" --password-stdin
      else
        echo "ERROR: registry credentials are not set (CI_REGISTRY_USER/PASSWORD or REGISTRY_USER/TOKEN)."
        exit 1
      fi
    - |
      docker_build_with_cache() {
        IMAGE_REF="$1"
        DOCKERFILE="$2"
        CACHE_REF="$3"
        shift 3
        docker pull "$CACHE_REF" >/dev/null 2>&1 || true
        if ! docker build --pull \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from "$CACHE_REF" \
            --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
            "$@" \
            -f "$DOCKERFILE" -t "$IMAGE_REF" .; then
          echo "WARN: cached docker build failed — retrying without cache-from"
          docker build --pull \
            --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
            "$@" \
            -f "$DOCKERFILE" -t "$IMAGE_REF" .
        fi
      }
      docker_push_buildcache() {
        IMAGE_REF="$1"
        CACHE_REF="$2"
        docker tag "$IMAGE_REF" "$CACHE_REF"
        docker push "$CACHE_REF" || echo "WARN: buildcache push skipped for $CACHE_REF"
      }
      build_and_push_app_image() {
        IMAGE_REF="$1"
        DOCKERFILE="$2"
        CACHE_REF="$3"
        shift 3
        echo "=== Build and Push ${IMAGE_REF} (context repo root) ==="
        if docker pull "$IMAGE_REF" >/dev/null 2>&1; then
          IMG_SHA="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF" 2>/dev/null || true)"
          if [ "$IMG_SHA" = "$CI_COMMIT_SHA" ]; then
            echo "=== Image $IMAGE_REF already built from $CI_COMMIT_SHA — skipping build ==="
          else
            echo "=== Image $IMAGE_REF exists but revision=${IMG_SHA:-none} != $CI_COMMIT_SHA — rebuilding ==="
            docker_build_with_cache "$IMAGE_REF" "$DOCKERFILE" "$CACHE_REF" "$@"
            docker push "$IMAGE_REF"
          fi
        else
          docker_build_with_cache "$IMAGE_REF" "$DOCKERFILE" "$CACHE_REF" "$@"
          docker push "$IMAGE_REF"
        fi
        docker_push_buildcache "$IMAGE_REF" "$CACHE_REF" || true
        if [ "${DEPLOY_ENV}" = "prod" ]; then
          PROD_LATEST="${IMAGE_REF%:*}:latest"
          docker pull "$IMAGE_REF"
          docker tag "$IMAGE_REF" "$PROD_LATEST"
          docker push "$PROD_LATEST"
        fi
      }

.vault_sonar:
  stage: quality
  timeout: 45m
  before_script:
    - "if command -v apk >/dev/null 2>&1; then apk add --no-cache curl jq >/dev/null 2>&1 || true; elif command -v apt-get >/dev/null 2>&1; then apt-get update >/dev/null 2>&1 && apt-get install -y curl jq >/dev/null 2>&1 || true; fi"
    - echo "=== Fetching SonarQube secrets from HashiCorp Vault Cluster ==="
    - !reference [.vault_kv_helpers, before_script]
    - |
      if [ -z "$VAULT_TOKEN" ]; then
        echo "WARN: VAULT_TOKEN is not defined in CI/CD variables."
      else
        for v_url in ${VAULT_SERVERS:-$VAULT_ADDR}; do
          echo "Trying Vault node for SonarQube secrets: ${v_url}..."
          VAULT_SONAR_RESP="$(vault_kv_get_http_then_https "$v_url" "secret/data/SONAR-CI" || true)"
          if [ -n "$VAULT_SONAR_RESP" ]; then
            echo "=== Fetched secret/data/SONAR-CI (values hidden) ==="
            if command -v jq >/dev/null 2>&1; then
              V_SONAR_URL="$(echo "$VAULT_SONAR_RESP" | jq -r '.data.data.SONAR_URL // .data.data.sonar_url // empty')"
              V_SONAR_TOKEN="$(echo "$VAULT_SONAR_RESP" | jq -r '.data.data["SONAR_TOKEN-CI"] // .data.data.SONAR_TOKEN // .data.data.sonar_token // empty')"
            else
              echo "WARN: jq not available, using sed fallback for parsing"
              V_SONAR_URL="$(echo "$VAULT_SONAR_RESP" | sed -n 's/.*"SONAR_URL"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
              V_SONAR_TOKEN="$(echo "$VAULT_SONAR_RESP" | sed -n 's/.*"SONAR_TOKEN-CI"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
              [ -z "$V_SONAR_TOKEN" ] && V_SONAR_TOKEN="$(echo "$VAULT_SONAR_RESP" | sed -n 's/.*"SONAR_TOKEN"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            fi
            [ -n "$V_SONAR_URL" ] && export SONAR_HOST_URL="${SONAR_HOST_URL:-$V_SONAR_URL}"
            [ -n "$V_SONAR_TOKEN" ] && export SONAR_TOKEN="${SONAR_TOKEN:-$V_SONAR_TOKEN}"
            break
          fi
        done
      fi

      echo "=== [Verification] SonarQube Vault Secret Extraction ==="
      if [ -n "$SONAR_HOST_URL" ]; then
        echo "✅ SONAR_HOST_URL : ${SONAR_HOST_URL}"
      else
        echo "❌ SONAR_HOST_URL : NOT FOUND"
      fi

      if [ -n "$SONAR_TOKEN" ]; then
        TOKEN_LEN=${#SONAR_TOKEN}
        echo "✅ SONAR_TOKEN    : LOADED (Length: ${TOKEN_LEN} chars)"
      else
        echo "❌ SONAR_TOKEN    : NOT FOUND"
      fi

.sonar_scan:
  extends:
    - .vault_sonar
    - .rules_tag
  image:
    name: $SONAR_SCANNER_IMAGE
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-${SONAR_CACHE_NAME}-${CI_PROJECT_NAME}"
    paths:
      - .sonar/cache
  script:
    - echo "=== SonarQube Scan ${SONAR_SCAN_NAME} (${SONAR_SCAN_KEY}) ==="
    - 'if [ -z "${SONAR_HOST_URL}" ] || [ -z "${SONAR_TOKEN}" ]; then echo "❌ ERROR: SONAR_HOST_URL or SONAR_TOKEN is not configured (rotate VAULT_TOKEN or set GitLab SONAR_* vars)." && exit 1; fi'
    - "sonar-scanner -Dsonar.projectKey=${SONAR_SCAN_KEY} -Dsonar.projectName=${CI_PROJECT_NAME}-${SONAR_SCAN_NAME} -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.token=${SONAR_TOKEN} -Dsonar.sources=${SONAR_SOURCES} -Dsonar.exclusions=${SONAR_EXCLUSIONS} -Dsonar.qualitygate.wait=false"
  allow_failure: false

.sonar_quality_gate:
  extends:
    - .vault_sonar
    - .rules_tag
  image: $ALPINE_IMAGE
  script:
    - echo "=== Quality Gate check ${SONAR_SCAN_LABEL} (${SONAR_SCAN_KEY}) ==="
    - 'if [ -z "${SONAR_HOST_URL}" ] || [ -z "${SONAR_TOKEN}" ]; then echo "❌ ERROR: SONAR_HOST_URL or SONAR_TOKEN is not configured (rotate VAULT_TOKEN or set GitLab SONAR_* vars)." && exit 1; fi'
    - 'RESP=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_SCAN_KEY}")'
    - 'STATUS=$(echo "$RESP" | jq -r ".projectStatus.status // empty")'
    - 'echo "Quality Gate ${SONAR_SCAN_LABEL} Status: ${STATUS:-UNKNOWN}"'
    - |
      if [ "${STATUS}" = "OK" ]; then
        echo "✅ Quality Gate PASSED successfully!"
      elif [ "${STATUS}" = "ERROR" ]; then
        echo "⚠️ Quality Gate FAILED (Metric thresholds not met):"
        echo "$RESP" | jq -r '.projectStatus.conditions[]? | select(.status == "ERROR") | "  - \(.metricKey): actual=\(.actualValue), threshold=\(.errorThreshold)"' 2>/dev/null || true
        echo "ℹ️ View details on dashboard: ${SONAR_HOST_URL}/dashboard?id=${SONAR_SCAN_KEY}"
      else
        echo "ℹ️ Quality Gate status is ${STATUS:-PENDING}"
      fi
  allow_failure: false

.node_quality:
  extends: .rules_tag
  stage: quality
  image: ${NODE_IMAGE}
  timeout: 20m
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm-${NODE_VERSION}
    paths:
      - .npm/
    policy: pull

.sbom_job:
  extends: .rules_tag
  stage: quality
  image:
    name: $SYFT_IMAGE
    entrypoint: [""]
  timeout: 15m
  allow_failure: true
  retry:
    max: 0

.trivy_scan:
  extends: .rules_tag
  stage: image-scan
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  timeout: 25m
  cache:
    key: trivy-${TRIVY_VERSION}
    paths:
      - .trivycache/
    policy: pull
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_INSECURE: "true"
  before_script:
    - |
      scan_image_with_trivy() {
        IMAGE_REF="$1"
        REPORT_FILE="$2"
        LABEL="$3"
        STATUS_FILE="$4"
        echo "=== Trivy Remote Image Scan (${LABEL}) ==="
        SCAN_OK=0
        if trivy image --format json --output "${REPORT_FILE}" --severity HIGH,CRITICAL --exit-code 0 "${IMAGE_REF}"; then
          SCAN_OK=1
        else
          echo "WARN: Trivy JSON scan returned non-zero; keeping allow-soft report path"
        fi
        CRITICAL_OK=0
        if [ "${SCAN_OK}" = "1" ] && [ -s "${REPORT_FILE}" ]; then
          trivy convert --format table "${REPORT_FILE}" || true
          echo "=== [${LABEL}] Strict: fail on CRITICAL ==="
          if trivy convert --severity CRITICAL --exit-code 1 "${REPORT_FILE}"; then
            CRITICAL_OK=1
          fi
        else
          trivy image --format table --severity HIGH,CRITICAL "${IMAGE_REF}" || true
          echo "=== [${LABEL}] Strict: fail on CRITICAL ==="
          if trivy image --severity CRITICAL --exit-code 1 "${IMAGE_REF}"; then
            CRITICAL_OK=1
          fi
        fi
        if [ "${CRITICAL_OK}" = "1" ]; then
          printf '%s\n' "PASSED" > "${STATUS_FILE}"
          echo "=== scan-status (${LABEL}): PASSED -> ${STATUS_FILE} ==="
        else
          printf '%s\n' "FAILED" > "${STATUS_FILE}"
          echo "=== scan-status (${LABEL}): FAILED -> ${STATUS_FILE} ==="
          exit 1
        fi
      }
  allow_failure: false

# ==============================================================================
# STAGE 0 — Prepare (resolve deploy target from tag ancestry)
# ==============================================================================
resolve-deploy-target:
  extends: .rules_tag
  stage: prepare
  image:
    name: $GIT_IMAGE
    entrypoint: [""]
  timeout: 10m
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: fetch
  script:
    - |
      set -eu
      echo "=== Resolving deploy target for tag ${CI_COMMIT_TAG} @ ${CI_COMMIT_SHA} ==="
      case "$CI_COMMIT_TAG" in
        *-dev)
          DEPLOY_ENV=dev
          BRANCH=develop
          APP_VERSION="${CI_COMMIT_TAG%-dev}"
          ;;
        *-test)
          DEPLOY_ENV=test
          BRANCH=test
          APP_VERSION="${CI_COMMIT_TAG%-test}"
          ;;
        *)
          DEPLOY_ENV=prod
          BRANCH=main
          APP_VERSION="${CI_COMMIT_TAG}"
          ;;
      esac
      DEPLOY_NAMESPACE="${DEPLOY_ENV}"
      echo "=== Tag ${CI_COMMIT_TAG} → DEPLOY_ENV=${DEPLOY_ENV} BRANCH=${BRANCH} APP_VERSION=${APP_VERSION} ==="
      git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/${BRANCH}"; then
        echo "ERROR: tag ${CI_COMMIT_TAG} targets ${DEPLOY_ENV} but commit is not on ${BRANCH}. Refusing to deploy."
        exit 1
      fi
      echo "=== Tag is ancestor of origin/${BRANCH} ==="
      printf 'DEPLOY_ENV=%s\nIMAGE_TAG=%s\nDEPLOY_NAMESPACE=%s\nAPP_VERSION=%s\n' \
        "$DEPLOY_ENV" "$CI_COMMIT_TAG" "$DEPLOY_NAMESPACE" "$APP_VERSION" > deploy-target.env
      cat deploy-target.env
  artifacts:
    reports:
      dotenv: deploy-target.env
    paths:
      - deploy-target.env
    expire_in: 7 days

# ==============================================================================
# STAGE 1 — Quality (Parallel Execution)
# ==============================================================================

sonar-scan-api:
  extends: .sonar_scan
  variables:
    SONAR_SCAN_KEY: "${SONAR_PROJECT_KEY_API}"
    SONAR_SCAN_NAME: "api"
    SONAR_SOURCES: "${BACKEND_DIR}"
    SONAR_EXCLUSIONS: "**/node_modules/**,**/dist/**,**/coverage/**,**/tests/**,**/test/**,**/graphify-out/**,old_app/**"
    SONAR_CACHE_NAME: "api"

sonar-scan-web:
  extends: .sonar_scan
  variables:
    SONAR_SCAN_KEY: "${SONAR_PROJECT_KEY_WEB}"
    SONAR_SCAN_NAME: "web"
    SONAR_SOURCES: "${FRONTEND_DIR}"
    SONAR_EXCLUSIONS: "**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/graphify-out/**,old_app/**"
    SONAR_CACHE_NAME: "web"

sonar-scan-quality-gate-api:
  extends: .sonar_quality_gate
  needs:
    - job: sonar-scan-api
      artifacts: false
  variables:
    SONAR_SCAN_KEY: "${SONAR_PROJECT_KEY_API}"
    SONAR_SCAN_LABEL: "API"

sonar-scan-quality-gate-web:
  extends: .sonar_quality_gate
  needs:
    - job: sonar-scan-web
      artifacts: false
  variables:
    SONAR_SCAN_KEY: "${SONAR_PROJECT_KEY_WEB}"
    SONAR_SCAN_LABEL: "Web"

unit-test-api:
  extends: .node_quality
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm-${NODE_VERSION}
    paths:
      - .npm/
    policy: pull-push
  script:
    - echo "=== Node.js Unit Test (API / ${BACKEND_DIR}) ==="
    - npm ci --cache .npm --prefer-offline
    - npm test --workspace "${NPM_WORKSPACE_API}"
  allow_failure: true

unit-test-web:
  extends: .node_quality
  script:
    - echo "=== Node.js Unit Test (Web / ${FRONTEND_DIR}) ==="
    - npm ci --cache .npm --prefer-offline
    - npm test --workspace "${NPM_WORKSPACE_WEB}"
  allow_failure: true

dependency-check-api:
  extends: .node_quality
  script:
    - echo "=== Node.js Dependency Check (API) ==="
    - npm ci --cache .npm --prefer-offline
    - npm audit --workspace "${NPM_WORKSPACE_API}" --audit-level=high --json > npm-audit-api.json || true
    - echo "=== Audit JSON saved ($(wc -c < npm-audit-api.json) bytes) ==="
  artifacts:
    when: always
    paths:
      - npm-audit-api.json
    expire_in: 7 days
  allow_failure: true

dependency-check-web:
  extends: .node_quality
  script:
    - echo "=== Node.js Dependency Check (Web) ==="
    - npm ci --cache .npm --prefer-offline
    - npm audit --workspace "${NPM_WORKSPACE_WEB}" --audit-level=high --json > npm-audit-web.json || true
    - echo "=== Audit JSON saved ($(wc -c < npm-audit-web.json) bytes) ==="
  artifacts:
    when: always
    paths:
      - npm-audit-web.json
    expire_in: 7 days
  allow_failure: true

sbom-generate-api:
  extends: .sbom_job
  script:
    - echo "=== SBOM Generation API (Syft) ==="
    - /syft dir:${BACKEND_DIR} -o table
    - /syft dir:${BACKEND_DIR} -o spdx-json=sbom-api.json -o cyclonedx-json=gl-sbom-api.cdx.json
    - echo "API SBOM saved to sbom-api.json and gl-sbom-api.cdx.json"
  artifacts:
    when: always
    paths:
      - sbom-api.json
      - gl-sbom-api.cdx.json
    reports:
      cyclonedx:
        - gl-sbom-api.cdx.json
    expire_in: 30 days

sbom-generate-web:
  extends: .sbom_job
  script:
    - echo "=== SBOM Generation Web (Syft) ==="
    - /syft dir:${FRONTEND_DIR} -o table
    - /syft dir:${FRONTEND_DIR} -o spdx-json=sbom-web.json -o cyclonedx-json=gl-sbom-web.cdx.json
    - echo "Web SBOM saved to sbom-web.json and gl-sbom-web.cdx.json"
  artifacts:
    when: always
    paths:
      - sbom-web.json
      - gl-sbom-web.cdx.json
    reports:
      cyclonedx:
        - gl-sbom-web.cdx.json
    expire_in: 30 days

# ==============================================================================
# STAGE 2 — Build & Push Docker Images (API & Web) + migration verify
# ==============================================================================

docker-build:
  extends:
    - .docker_service
    - .rules_tag
  stage: build
  timeout: 45m
  dependencies:
    - resolve-deploy-target
  script:
    - docker version
    - build_and_push_app_image "${IMAGE_API}:${CI_COMMIT_TAG}" "${BACKEND_DIR}/Dockerfile" "${IMAGE_API}:buildcache" --build-arg NODE_VERSION="${NODE_VERSION}" --build-arg APP_VERSION="${APP_VERSION}"

docker-build-web:
  extends:
    - .docker_service
    - .rules_tag
  stage: build
  timeout: 45m
  dependencies:
    - resolve-deploy-target
  script:
    - docker version
    - build_and_push_app_image "${IMAGE_WEB}:${CI_COMMIT_TAG}" "${FRONTEND_DIR}/Dockerfile" "${IMAGE_WEB}:buildcache" --build-arg NODE_VERSION="${NODE_VERSION}" --build-arg API_BASE_URL=/api --build-arg VITE_API_BASE_URL=/api --build-arg VITE_APP_VERSION="${APP_VERSION}"

db-migrate-verify:
  extends:
    - .docker_service
    - .rules_tag
  stage: build
  timeout: 20m
  needs:
    - job: docker-build
      artifacts: false
  script:
    - |
      MIGRATE_NET="migrate-net-${CI_JOB_ID}"
      MYSQL_NAME="mysql-migrate-${CI_JOB_ID}"
      trap 'docker rm -f "${MYSQL_NAME}" >/dev/null 2>&1 || true; docker network rm "${MIGRATE_NET}" >/dev/null 2>&1 || true' EXIT
    - docker pull "${IMAGE_API}:${CI_COMMIT_TAG}"
    - docker network create "${MIGRATE_NET}"
    - |
      docker run -d --name "${MYSQL_NAME}" --network "${MIGRATE_NET}" \
        -e MYSQL_DATABASE=buu_get_verify \
        -e MYSQL_USER=buu_get_ci \
        -e MYSQL_PASSWORD=ci_migrate_pass \
        -e MYSQL_ROOT_PASSWORD=ci_root_pass \
        ${MYSQL_IMAGE}
    - |
      echo "=== Waiting for CI MySQL ==="
      for i in $(seq 1 45); do
        if docker exec "${MYSQL_NAME}" mysqladmin ping -h127.0.0.1 -uroot -pci_root_pass --silent; then
          echo "MySQL is ready"
          break
        fi
        echo "Waiting for MySQL ($i)..."
        sleep 2
        if [ "$i" -eq 45 ]; then
          echo "ERROR: CI MySQL did not become ready"
          docker logs "${MYSQL_NAME}" || true
          exit 1
        fi
      done
    - |
      echo "=== TypeORM migration:show (blocking) ==="
      docker run --rm --network "${MIGRATE_NET}" \
        -e DB_TYPE=mysql \
        -e DB_HOST="${MYSQL_NAME}" \
        -e DB_PORT=3306 \
        -e DB_USER=buu_get_ci \
        -e DB_PASSWORD=ci_migrate_pass \
        -e DB_NAME=buu_get_verify \
        "${IMAGE_API}:${CI_COMMIT_TAG}" \
        node ../../node_modules/typeorm/cli.js migration:show -d dist/database/data-source.js
    - |
      echo "=== Skipping empty-DB migration:run (EX_T_SESSIONS vs EXAM_T_SESSIONS clash) ==="
      echo "=== Deploy still runs migration:run via the Helm Job against the live namespace ==="

# ==============================================================================
# STAGE 3 — Docker Image Scan (Trivy)
# ==============================================================================
image-scan:
  extends: .trivy_scan
  cache:
    key: trivy-${TRIVY_VERSION}
    paths:
      - .trivycache/
    policy: pull-push
  needs:
    - job: docker-build
      artifacts: false
    - job: resolve-deploy-target
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev$/
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-test)?$/
      allow_failure: false
  script:
    - scan_image_with_trivy "${IMAGE_API}:${CI_COMMIT_TAG}" trivy-report-api.json "API" scan-status-api.txt
  artifacts:
    when: always
    paths:
      - trivy-report-api.json
      - scan-status-api.txt
    expire_in: 7 days

image-scan-web:
  extends: .trivy_scan
  needs:
    - job: docker-build-web
      artifacts: false
    - job: resolve-deploy-target
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev$/
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-test)?$/
      allow_failure: false
  script:
    - scan_image_with_trivy "${IMAGE_WEB}:${CI_COMMIT_TAG}" trivy-report-web.json "WEB" scan-status-web.txt
  artifacts:
    when: always
    paths:
      - trivy-report-web.json
      - scan-status-web.txt
    expire_in: 7 days

# STAGE 4 — Deploy jobs live in .gitlab/ci/deploy.yml (included above).

# ==============================================================================
# STAGE 5 — DAST: OWASP ZAP (optional, manual)
# ==============================================================================
dast:
  stage: dast
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  timeout: 20m
  retry:
    max: 0
  dependencies: []
  rules:
    - when: manual
      allow_failure: true
  variables:
    ZAP_TARGET: $APP_URL_TEST
  script:
    - 'echo "=== OWASP ZAP Baseline Scan ${ZAP_TARGET} ==="'
    - mkdir -p /zap/wrk
    - zap-baseline.py -t "${ZAP_TARGET}" -r zap-report.html -J zap-report.json -I
  artifacts:
    when: always
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 7 days

# ==============================================================================
# STAGE 6 — Performance Test: k6 (optional, manual)
# ==============================================================================
perf-test:
  stage: perf
  image: $K6_IMAGE
  timeout: 15m
  retry:
    max: 0
  dependencies: []
  rules:
    - when: manual
      allow_failure: true
  variables:
    K6_TARGET: $APP_URL_TEST
  script:
    - 'echo "=== k6 Performance Test ${K6_TARGET} ==="'
    - 'echo "import http from \"k6/http\";" > load-test.js'
    - 'echo "import { check, sleep } from \"k6\";" >> load-test.js'
    - 'echo "export let options = { vus: 10, duration: \"30s\" };" >> load-test.js'
    - 'echo "export default function () { let res = http.get(\"${K6_TARGET}/\"); check(res, { status_is_200: (r) => r.status === 200 }); sleep(1); }" >> load-test.js'
    - "k6 run load-test.js --out json=k6-results.json"
  artifacts:
    when: always
    paths:
      - k6-results.json
    expire_in: 7 days
