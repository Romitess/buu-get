            [ -n "$V_KUBE" ] && KUBECONFIG="${KUBECONFIG:-$V_KUBE}"
            [ -n "$V_USER" ] && REGISTRY_USER="${REGISTRY_USER:-$V_USER}"
            [ -n "$V_TOKEN" ] && REGISTRY_TOKEN="${REGISTRY_TOKEN:-$V_TOKEN}"
            [ -n "$V_REG_HOST" ] && REGISTRY_HOST="${REGISTRY_HOST:-$V_REG_HOST}"
            break
          fi

          if [ -n "$VAULT_COMMON_RESP" ]; then
            break
          fi
        done
      fi
    - 'KUBECONFIG_VAR="${KUBECONFIG:-$KUBECONFIG_PROD}"'
    - 'if [ -z "$KUBECONFIG_VAR" ]; then echo "WARNING: KUBECONFIG is not set." && exit 0; fi'
    - 'RELEASE_NAME="${APP_NAME:-${CI_PROJECT_NAME_SLUG:-${CI_PROJECT_NAME}}}"'
    - 'echo "=== Deploying Node Release to PROD: ${RELEASE_NAME} ==="'
    - mkdir -p ~/.kube
    - 'if [ -f "$KUBECONFIG_VAR" ]; then cp "$KUBECONFIG_VAR" ~/.kube/config; elif [ -f "$KUBECONFIG" ]; then cp "$KUBECONFIG" ~/.kube/config; else printf "%s" "$KUBECONFIG_VAR" > ~/.kube/config; fi'
    - chmod 600 ~/.kube/config
    - kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f - --kubeconfig ~/.kube/config || true
    
    # Create imagePullSecret regcred
    - 'PULL_USER="${REGISTRY_USER:-${REGISTRY_READ_USER:-$CI_REGISTRY_USER}}"'
    - 'PULL_PASS="${REGISTRY_TOKEN:-${REGISTRY_PASSWORD:-${REGISTRY_READ_PASSWORD:-$CI_REGISTRY_PASSWORD}}}"'
    - 'IMG_HOST=$(echo "$IMAGE" | cut -d/ -f1)'
    - 'if [ -n "$PULL_USER" ] && [ -n "$PULL_PASS" ]; then AUTH_B64=$(printf "%s:%s" "$PULL_USER" "$PULL_PASS" | base64 | tr -d "\r\n"); SERVERS="$REGISTRY_HOST $CI_REGISTRY $IMG_HOST gitlabregistry.buu.ac.th registry.gitlabcc-devops.buu.ac.th gitlabcc-devops.buu.ac.th"; mkdir -p /tmp/k8s-auth; printf "{\"auths\":{" > /tmp/k8s-auth/config.json; FIRST=1; for s in $SERVERS; do if [ -n "$s" ]; then for prefix in "" "https://" "http://"; do for suffix in "" "/v1/" "/v2/"; do KEY="${prefix}${s}${suffix}"; if [ $FIRST -eq 0 ]; then printf "," >> /tmp/k8s-auth/config.json; fi; printf "\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}" "$KEY" "$PULL_USER" "$PULL_PASS" "$AUTH_B64" >> /tmp/k8s-auth/config.json; FIRST=0; done; done; fi; done; printf "}}" >> /tmp/k8s-auth/config.json; echo "=== Creating multi-domain imagePullSecret regcred (User: ${PULL_USER}) ==="; kubectl create secret generic regcred --from-file=.dockerconfigjson=/tmp/k8s-auth/config.json --type=kubernetes.io/dockerconfigjson -n prod --dry-run=client -o yaml | kubectl apply -f - --kubeconfig ~/.kube/config || true; fi'
    
    # Create Application Secret
    - echo "=== Creating Application Secret ${RELEASE_NAME}-env ==="
    - |
      ENV_VAR="${DOTENV_PROD:-$DOTENV_FILE}"
      if [ -z "$ENV_VAR" ]; then
        echo "❌ ERROR: DOTENV_PROD variable is empty in GitLab CI/CD Variables." && exit 1
      fi
      if [ -f "$ENV_VAR" ]; then
        ENV_PATH="$ENV_VAR"
      else
        printf "%s\n" "$ENV_VAR" > /tmp/app_env.env
        ENV_PATH="/tmp/app_env.env"
      fi
      echo "=== Creating Secret from Dotenv File Variable (${ENV_PATH}) ==="
      kubectl create secret generic ${RELEASE_NAME}-env \
        --from-env-file="$ENV_PATH" \
        -n prod --dry-run=client -o yaml | kubectl apply -f - --kubeconfig ~/.kube/config
      rm -f /tmp/app_env.env
    
    - helm version
    - 'TAG_OR_SHA="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"'
    - helm upgrade --install "${RELEASE_NAME}" "${HELM_CHART_PATH}" -f "${HELM_CHART_PATH}/values-prod.yaml" --set image.repository="${IMAGE_API}" --set image.tag="${TAG_OR_SHA}" --set web.image.repository="${IMAGE_WEB}" --set web.image.tag="${TAG_OR_SHA}" --set ingress.host="${RELEASE_NAME}.buu.ac.th" -n prod --create-namespace --kubeconfig ~/.kube/config

# ==============================================================================
# STAGE 5 — DAST: OWASP ZAP (optional, manual)
# ==============================================================================
dast:
  stage: dast
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  tags:
    - $RUNNER_TAG
  when: manual
  allow_failure: true
  variables:
    ZAP_TARGET: $APP_URL_TEST
  script:
    - 'echo "=== OWASP ZAP Baseline Scan ${ZAP_TARGET} ==="'
    - mkdir -p /zap/wrk
    - zap-baseline.py -t "${ZAP_TARGET}" -r zap-report.html -J zap-report.json -I
  artifacts:
    when: always
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 7 days

# ==============================================================================
# STAGE 6 — Performance Test: k6 (optional, manual)
# ==============================================================================
perf-test:
  stage: perf
  image: grafana/k6:latest
  tags:
    - $RUNNER_TAG
  when: manual
  allow_failure: true
  variables:
    K6_TARGET: $APP_URL_TEST
  script:
    - 'echo "=== k6 Performance Test ${K6_TARGET} ==="'
    - 'echo "import http from \"k6/http\";" > load-test.js'
    - 'echo "import { check, sleep } from \"k6\";" >> load-test.js'
    - 'echo "export let options = { vus: 10, duration: \"30s\" };" >> load-test.js'
    - 'echo "export default function () { let res = http.get(\"${K6_TARGET}/\"); check(res, { status_is_200: (r) => r.status === 200 }); sleep(1); }" >> load-test.js'
    - 'k6 run load-test.js --out json=k6-results.json'
  artifacts:
    when: always
    paths:
      - k6-results.json
    expire_in: 7 days